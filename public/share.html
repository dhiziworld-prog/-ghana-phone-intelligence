<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share my location</title>
<style>body{font-family:Arial,sans-serif;max-width:560px;margin:40px auto;padding:18px;color:#172b3a}.card{border:1px solid #dce5ed;border-radius:14px;padding:24px}button{background:#1769aa;color:white;border:0;border-radius:8px;padding:14px;font-size:16px}.small{color:#607487;line-height:1.5}#s{margin-top:18px}</style></head><body><div class="card"><h2>Voluntary location sharing</h2><p>This page can share your device's current GPS coordinates with the person who sent you this link.</p><p class="small">Only continue if you agree. Your location is requested only after you press the button and approve your browser's location permission.</p><button id="go">Share my location</button><div id="s" role="status"></div></div>
<script>const token=location.pathname.split("/").pop(),s=document.getElementById("s");document.getElementById("go").onclick=()=>{if(!navigator.geolocation){s.textContent="Location is not supported by this browser.";return;}s.textContent="Waiting for your permission…";navigator.geolocation.getCurrentPosition(async p=>{try{let r=await fetch("/api/share/"+encodeURIComponent(token)+"/location",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({consent:true,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})});if(!r.ok)throw Error();s.textContent="Your location has been shared."; }catch(e){s.textContent="Could not save the location."; }},e=>s.textContent="Location not shared: "+e.message,{enableHighAccuracy:true,timeout:20000,maximumAge:0});};</script></body></html>
